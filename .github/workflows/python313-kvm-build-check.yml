name: Isolated full Ubuntu 24.04 x64 KVM build
on:
  push:
    branches: [codex/python313-kvm-build-check]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      IMAGE_SHA: f521990316a71f7cd42626174aa4cbdcf25d1c56
    steps:
      - name: Check KVM and prepare disposable build host
        run: |
          set -euo pipefail
          ls -l /dev/kvm
          sudo chown root:kvm /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          sudo rm -rf /usr/local/lib/android /usr/local/share/boost /usr/share/dotnet /opt/ghc
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          dir="$RUNNER_TEMP/canary-bin"
          mkdir -p "$dir"
          curl -fsSL --retry 3 https://github.com/mikefarah/yq/releases/download/v4.54.2/yq_linux_amd64 -o "$dir/yq"
          echo "44c7759059b4910827a0059a2757b22001e59360cdecdb2ef8dedc4b6c7e9f32  $dir/yq" | sha256sum -c -
          chmod +x "$dir/yq"
          curl -fsSLO --retry 3 https://releases.hashicorp.com/packer/1.16.2/packer_1.16.2_linux_amd64.zip
          curl -fsSLO --retry 3 https://releases.hashicorp.com/packer/1.16.2/packer_1.16.2_SHA256SUMS
          grep -E '  packer_1.16.2_linux_amd64.zip$' packer_1.16.2_SHA256SUMS | sha256sum -c -
          unzip -q packer_1.16.2_linux_amd64.zip -d "$dir"
          echo "$dir" >> "$GITHUB_PATH"
      - name: Build full Ubuntu 24.04 x64 image from PR 6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/runner-images"
          cd "$RUNNER_TEMP/runner-images"
          git fetch -q --depth=1 https://github.com/tatnet-ru/runner-images.git "$IMAGE_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$IMAGE_SHA"
          bin/sync-local --image-id ubuntu24-full-x64
          ruby test/tatnet_sync_check.rb
          # The host resolves public release metadata with its job token.
          # Only public API responses enter the guest.
          ubuntu=releases/ubuntu24/x64/images/ubuntu
          cache="$ubuntu/scripts/helpers/release-api-cache"
          mkdir -p "$cache"
          cache_api() {
            local path="$1" key
            key=$(printf '%s' "$path" | sha256sum | cut -d ' ' -f1)
            gh api "$path" > "$cache/$key"
          }
          for repo in actions/action-versions runs-on/runner Azure/bicep aws/aws-sam-cli Kitware/CMake cli/cli kubernetes-sigs/kind oras-project/oras ruby/ruby-builder SeleniumHQ/selenium mikefarah/yq; do
            cache_api "repos/$repo/releases?per_page=100"
          done
          while IFS= read -r plugin; do
            cache_api "repos/docker/$plugin/releases?per_page=100"
          done < <(jq -r '.docker.plugins[].plugin' "$ubuntu/toolsets/toolset-2404.json")
          for repo in actions/runner nvm-sh/nvm facebook/zstd; do
            cache_api "repos/$repo/releases/latest"
          done
          cache_api repos/runs-on/action/git/ref/heads/v2
          python3 - "$ubuntu" <<'PYTHON'
          from pathlib import Path
          import sys
          ubuntu = Path(sys.argv[1])
          helper = ubuntu / "scripts/helpers/install.sh"
          text = helper.read_text()
          marker = "    local api_path=$1\n"
          assert text.count(marker) == 1
          text = text.replace(marker, marker + (
              '    local key cached\n'
              '    key=$(printf "%s" "$api_path" | sha256sum | cut -d " " -f1)\n'
              '    cached="$HELPER_SCRIPTS/release-api-cache/$key"\n'
              '    if [[ -r "$cached" ]]; then cat "$cached"; return; fi\n'
          ))
          helper.write_text(text)
          actions = ubuntu / "scripts/build/install-actions-cache.sh"
          text = actions.read_text().replace(
              'curl -fsSL "https://api.github.com/repos/runs-on/action/git/ref/heads/v2"',
              'get_github_api_json "repos/runs-on/action/git/ref/heads/v2"',
          ).replace('https://api.github.com/repos/runs-on/action/tarball/', 'https://codeload.github.com/runs-on/action/legacy.tar.gz/')
          actions.write_text(text)
          finalize = ubuntu / "custom/files/finalize-runner-environment.sh"
          text = finalize.read_text().replace('set -euo pipefail\n', 'set -euo pipefail\nrm -rf /imagegeneration/helpers/release-api-cache\n', 1)
          finalize.write_text(text)
          PYTHON
          unset GH_TOKEN
          # The stock QEMU CPU omits SSE4/POPCNT required by the pinned .NET SDK.
          sed -i '/accelerator      = "kvm"/a\  cpu_model        = "host"' patches/ubuntu/templates/ubuntu-full-x64-qemu.pkr.hcl
          bin/build-qemu --image-id ubuntu24-full-x64 --work "$RUNNER_TEMP/canary-image" --cpus 2 --memory 6144
          sha256sum "$RUNNER_TEMP/canary-image/out/ubuntu24-full-x64.qcow2"
      - name: Boot the full image and prove setup-python uses cache offline
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/test-runner"
          mkdir -m 700 "$root"
          cd "$root"
          ssh-keygen -q -t ed25519 -N '' -f key
          cat > user-data <<CLOUD
          #cloud-config
          users:
            - name: runner
              shell: /bin/bash
              lock_passwd: true
              ssh_authorized_keys:
                - $(cat key.pub)
          runcmd:
            - [systemctl, start, ssh.service]
          CLOUD
          echo 'instance-id: isolated-python313-image' > meta-data
          cloud-localds seed.iso user-data meta-data
          image="$RUNNER_TEMP/canary-image/out/ubuntu24-full-x64.qcow2"
          qemu-img check "$image"
          qemu-img create -q -f qcow2 -F qcow2 -b "$image" runner.qcow2
          qemu-system-x86_64 -enable-kvm -cpu host -smp 2 -m 5120 -display none \
            -drive if=virtio,format=qcow2,file=runner.qcow2 \
            -drive media=cdrom,readonly=on,file=seed.iso \
            -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:22413-:22 \
            -serial file:serial.log -daemonize -pidfile qemu.pid
          trap 'kill "$(cat qemu.pid)" 2>/dev/null || true' EXIT
          guest() {
            ssh -i key -p 22413 -o BatchMode=yes -o ConnectTimeout=4 -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=known_hosts runner@127.0.0.1 "$@"
          }
          for i in {1..60}; do
            if guest true 2>/dev/null; then break; fi
            sleep 3
          done
          guest 'cloud-init status --wait; test "$(uname -m)" = x86_64'
          curl -fsSL --retry 3 https://codeload.github.com/actions/setup-python/legacy.tar.gz/refs/tags/v7 |
            guest 'mkdir -p ~/setup-python; tar -xzf - --strip-components=1 -C ~/setup-python'
          guest 'sudo unshare --net runuser -u runner -- bash -s' <<'GUEST'
          set -euo pipefail
          export RUNNER_TOOL_CACHE=/opt/hostedtoolcache AGENT_TOOLSDIRECTORY=/opt/hostedtoolcache
          ls "$RUNNER_TOOL_CACHE"/Python/3.13.*/x64.complete
          export RUNNER_TEMP=$(mktemp -d)
          export GITHUB_ENV="$RUNNER_TEMP/env" GITHUB_PATH="$RUNNER_TEMP/path" GITHUB_OUTPUT="$RUNNER_TEMP/out"
          touch "$GITHUB_ENV" "$GITHUB_PATH" "$GITHUB_OUTPUT"
          node=$(find /home/runner/externals/node24 -type f -name node -print -quit)
          time env 'INPUT_PYTHON-VERSION=3.13' 'INPUT_CHECK-LATEST=false' 'INPUT_ALLOW-PRERELEASES=false' \
            'INPUT_FREETHREADED=false' 'INPUT_UPDATE-ENVIRONMENT=true' "$node" /home/runner/setup-python/dist/setup/index.js | tee "$RUNNER_TEMP/setup.log"
          grep -F 'Found tool in cache Python 3.13.' "$RUNNER_TEMP/setup.log"
          "$RUNNER_TOOL_CACHE"/Python/3.13.*/x64/bin/python --version
          GUEST
      - name: Show guest serial log on failure
        if: failure()
        run: |
          file="$RUNNER_TEMP/test-runner/serial.log"
          if test -f "$file"; then tail -n 120 "$file"; fi
